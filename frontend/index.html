<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator" role="application" aria-label="Scientific calculator">
    <div id="display" class="display" aria-live="polite" role="textbox" aria-readonly="true">0</div>
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden></div>
    <div class="keypad">
      <!-- Row 1: Memory & Angle & Theme -->
      <button class="btn" data-action="mc" aria-label="Memory Clear">MC</button>
      <button class="btn" data-action="mr" aria-label="Memory Recall">MR</button>
      <button class="btn" data-action="m+" aria-label="Memory Add">M+</button>
      <button class="btn" data-action="angle" aria-label="Toggle Angle Mode" id="angle-toggle">Rad</button>
      <button class="btn" data-action="theme" aria-label="Toggle Theme" id="theme-toggle">Dark</button>
      <button class="btn" data-action="contrast" aria-label="Toggle High Contrast" id="contrast-toggle">High Contrast</button>
      <!-- Row 2: Functions -->
      <button class="btn" data-action="sin" aria-label="Sine">sin</button>
      <button class="btn" data-action="cos" aria-label="Cosine">cos</button>
      <button class="btn" data-action="tan" aria-label="Tangent">tan</button>
      <button class="btn" data-action="asin" aria-label="Arc Sine">asin</button>
      <button class="btn" data-action="acos" aria-label="Arc Cosine">acos</button>
      <button class="btn" data-action="atan" aria-label="Arc Tangent">atan</button>
      <button class="btn" data-action="log" aria-label="Logarithm base 10">log</button>
      <button class="btn" data-action="ln" aria-label="Natural Logarithm">ln</button>
      <button class="btn" data-action="exp" aria-label="Exponential">exp</button>
      <button class="btn" data-action="sqrt" aria-label="Square Root">√</button>
      <button class="btn" data-action="factorial" aria-label="Factorial">n!</button>
      <!-- Row 3: Numbers & Operators -->
      <button class="btn" data-action="7" aria-label="Seven">7</button>
      <button class="btn" data-action="8" aria-label="Eight">8</button>
      <button class="btn" data-action="9" aria-label="Nine">9</button>
      <button class="btn" data-action="/" aria-label="Divide">/</button>
      <button class="btn" data-action="4" aria-label="Four">4</button>
      <button class="btn" data-action="5" aria-label="Five">5</button>
      <button class="btn" data-action="6" aria-label="Six">6</button>
      <button class="btn" data-action="*" aria-label="Multiply">*</button>
      <button class="btn" data-action="1" aria-label="One">1</button>
      <button class="btn" data-action="2" aria-label="Two">2</button>
      <button class="btn" data-action="3" aria-label="Three">3</button>
      <button class="btn" data-action="-" aria-label="Subtract">-</button>
      <button class="btn" data-action="0" aria-label="Zero">0</button>
      <button class="btn" data-action="." aria-label="Decimal Point">.</button>
      <button class="btn" data-action="^" aria-label="Exponent">^</button>
      <button class="btn" data-action="+" aria-label="Add">+</button>
      <!-- Row 4: Parentheses & Equals -->
      <button class="btn" data-action="(" aria-label="Open Parenthesis">(</button>
      <button class="btn" data-action=")" aria-label="Close Parenthesis">)</button>
      <button class="btn" data-action="clear" aria-label="Clear Entry">C</button>
      <button class="btn" data-action="del" aria-label="Delete">←</button>
      <button class="btn" data-action="equals" aria-label="Equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

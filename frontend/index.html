<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Vanilla Calculator</title>
  <!-- Content Security Policy: only allow resources from the same origin -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" class="display" readonly />
    <div class="buttons">
      <button class="button" data-value="C">C</button>
      <button class="button" data-value="DEL">DEL</button>
      <button class="button" data-value="/">÷</button>
      <button class="button" data-value="*">×</button>

      <button class="button" data-value="7">7</button>
      <button class="button" data-value="8">8</button>
      <button class="button" data-value="9">9</button>
      <button class="button" data-value="-">−</button>

      <button class="button" data-value="4">4</button>
      <button class="button" data-value="5">5</button>
      <button class="button" data-value="6">6</button>
      <button class="button" data-value="+">+</button>

      <button class="button" data-value="1">1</button>
      <button class="button" data-value="2">2</button>
      <button class="button" data-value="3">3</button>
      <button class="button" data-value="=">=</button>

      <button class="button zero" data-value="0">0</button>
      <button class="button" data-value=".">.</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

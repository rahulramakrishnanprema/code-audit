<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="calculator" class="calculator" role="application" aria-label="Scientific Calculator">
    <div id="display" class="display" aria-live="polite" aria-atomic="true"></div>
    <div id="error" class="error" aria-live="assertive"></div>

    <div class="grid">
      <!-- Row 1: Memory and angle toggle -->
      <button class="btn memory" data-action="mc" aria-label="Memory Clear">MC</button>
      <button class="btn memory" data-action="mr" aria-label="Memory Recall">MR</button>
      <button class="btn memory" data-action="m+" aria-label="Memory Add">M+</button>
      <button class="btn memory" data-action="m-" aria-label="Memory Subtract">M-</button>
      <button class="btn" data-action="toggle-angle" aria-label="Toggle Angle Mode">Deg</button>

      <!-- Row 2: Functions -->
      <button class="btn func" data-action="sin" aria-label="Sine">sin</button>
      <button class="btn func" data-action="cos" aria-label="Cosine">cos</button>
      <button class="btn func" data-action="tan" aria-label="Tangent">tan</button>
      <button class="btn func" data-action="asin" aria-label="Arc Sine">asin</button>
      <button class="btn func" data-action="acos" aria-label="Arc Cosine">acos</button>

      <!-- Row 3: Functions -->
      <button class="btn func" data-action="atan" aria-label="Arc Tangent">atan</button>
      <button class="btn func" data-action="log" aria-label="Logarithm base 10">log</button>
      <button class="btn func" data-action="ln" aria-label="Natural Logarithm">ln</button>
      <button class="btn func" data-action="exp" aria-label="Exponential">exp</button>
      <button class="btn func" data-action="sqrt" aria-label="Square Root">√</button>

      <!-- Row 4: Numbers and operators -->
      <button class="btn" data-action="7" aria-label="Seven">7</button>
      <button class="btn" data-action="8" aria-label="Eight">8</button>
      <button class="btn" data-action="9" aria-label="Nine">9</button>
      <button class="btn" data-action="/" aria-label="Divide">/</button>
      <button class="btn" data-action="^" aria-label="Power">^</button>

      <button class="btn" data-action="4" aria-label="Four">4</button>
      <button class="btn" data-action="5" aria-label="Five">5</button>
      <button class="btn" data-action="6" aria-label="Six">6</button>
      <button class="btn" data-action="*" aria-label="Multiply">*</button>
      <button class="btn" data-action="!" aria-label="Factorial">!</button>

      <button class="btn" data-action="1" aria-label="One">1</button>
      <button class="btn" data-action="2" aria-label="Two">2</button>
      <button class="btn" data-action="3" aria-label="Three">3</button>
      <button class="btn" data-action="-" aria-label="Subtract">-</button>
      <button class="btn" data-action="%" aria-label="Percent">%</button>

      <button class="btn" data-action="0" aria-label="Zero">0</button>
      <button class="btn" data-action="." aria-label="Decimal Point">.</button>
      <button class="btn" data-action="(" aria-label="Open Parenthesis">(</button>
      <button class="btn" data-action=")" aria-label="Close Parenthesis">)</button>
      <button class="btn" data-action="=" aria-label="Equals">=</button>

      <button class="btn" data-action="c" aria-label="Clear">C</button>
      <button class="btn" data-action="back" aria-label="Backspace">←</button>
    </div>

    <!-- Memory Slots Panel -->
    <div class="memory-panel" aria-label="Memory Slots">
      <p>Memory Slots:</p>
      <div class="slots">
        <button class="mem-slot" data-slot="0" aria-label="Memory slot 0">M0</button>
        <button class="mem-slot" data-slot="1" aria-label="Memory slot 1">M1</button>
        <button class="mem-slot" data-slot="2" aria-label="Memory slot 2">M2</button>
        <button class="mem-slot" data-slot="3" aria-label="Memory slot 3">M3</button>
        <button class="mem-slot" data-slot="4" aria-label="Memory slot 4">M4</button>
        <button class="mem-slot" data-slot="5" aria-label="Memory slot 5">M5</button>
        <button class="mem-slot" data-slot="6" aria-label="Memory slot 6">M6</button>
        <button class="mem-slot" data-slot="7" aria-label="Memory slot 7">M7</button>
        <button class="mem-slot" data-slot="8" aria-label="Memory slot 8">M8</button>
        <button class="mem-slot" data-slot="9" aria-label="Memory slot 9">M9</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

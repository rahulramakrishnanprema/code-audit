<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="calculator">
    <div id="display">0</div>
    <div class="buttons">
      <button data-action="clear" class="btn wide">C</button>
      <button data-action="backspace" class="btn">←</button>
      <button data-action="operator" class="btn" data-value="÷">÷</button>
      <button data-action="operator" class="btn" data-value="×">×</button>

      <button data-action="number" class="btn" data-value="7">7</button>
      <button data-action="number" class="btn" data-value="8">8</button>
      <button data-action="number" class="btn" data-value="9">9</button>
      <button data-action="operator" class="btn" data-value="-">-</button>

      <button data-action="number" class="btn" data-value="4">4</button>
      <button data-action="number" class="btn" data-value="5">5</button>
      <button data-action="number" class="btn" data-value="6">6</button>
      <button data-action="operator" class="btn" data-value="+">+</button>

      <button data-action="number" class="btn" data-value="1">1</button>
      <button data-action="number" class="btn" data-value="2">2</button>
      <button data-action="number" class="btn" data-value="3">3</button>
      <button data-action="equals" class="btn equal">=</button>

      <button data-action="number" class="btn wide" data-value="0">0</button>
      <button data-action="number" class="btn" data-value=".">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

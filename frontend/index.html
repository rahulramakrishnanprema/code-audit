<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla Scientific Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Scientific calculator">
    <!-- Display -->
    <div id="display" class="display" role="textbox" aria-live="polite" aria-label="Calculator display"></div>

    <!-- Controls (theme & angle mode) -->
    <section class="top-controls">
      <button id="theme-toggle" class="control-btn" aria-pressed="false">🌙 Dark</button>
      <button id="angle-toggle" class="control-btn" aria-pressed="false">Deg</button>
    </section>

    <!-- Buttons Grid -->
    <section class="buttons" role="grid" aria-label="Calculator keys">
      <!-- Row 1 -->
      <button class="btn" data-action="clear" aria-label="Clear" role="gridcell">C</button>
      <button class="btn" data-action="delete" aria-label="Delete" role="gridcell">DEL</button>
      <button class="btn" data-action="(" aria-label="Open parenthesis" role="gridcell">(</button>
      <button class="btn" data-action=")" aria-label="Close parenthesis" role="gridcell">)</button>
      <button class="btn" data-action="/" aria-label="Divide" role="gridcell">÷</button>

      <!-- Row 2 -->
      <button class="btn" data-action="7" aria-label="7" role="gridcell">7</button>
      <button class="btn" data-action="8" aria-label="8" role="gridcell">8</button>
      <button class="btn" data-action="9" aria-label="9" role="gridcell">9</button>
      <button class="btn" data-action="*" aria-label="Multiply" role="gridcell">×</button>
      <button class="btn" data-action="sqrt" aria-label="Square root" role="gridcell">√</button>

      <!-- Row 3 -->
      <button class="btn" data-action="4" aria-label="4" role="gridcell">4</button>
      <button class="btn" data-action="5" aria-label="5" role="gridcell">5</button>
      <button class="btn" data-action="6" aria-label="6" role="gridcell">6</button>
      <button class="btn" data-action="-" aria-label="Subtract" role="gridcell">−</button>
      <button class="btn" data-action="log" aria-label="Log base 10" role="gridcell">log</button>

      <!-- Row 4 -->
      <button class="btn" data-action="1" aria-label="1" role="gridcell">1</button>
      <button class="btn" data-action="2" aria-label="2" role="gridcell">2</button>
      <button class="btn" data-action="3" aria-label="3" role="gridcell">3</button>
      <button class="btn" data-action="+" aria-label="Add" role="gridcell">+</button>
      <button class="btn" data-action="ln" aria-label="Natural logarithm" role="gridcell">ln</button>

      <!-- Row 5 -->
      <button class="btn" data-action="0" aria-label="0" role="gridcell">0</button>
      <button class="btn" data-action="." aria-label="Decimal point" role="gridcell">.</button>
      <button class="btn" data-action="=" aria-label="Equals" role="gridcell">=</button>
      <button class="btn" data-action="^" aria-label="Power" role="gridcell">^</button>
      <button class="btn" data-action="%" aria-label="Modulo" role="gridcell">%</button>

      <!-- Row 6 – Functions -->
      <button class="btn" data-action="sin" aria-label="Sine" role="gridcell">sin</button>
      <button class="btn" data-action="cos" aria-label="Cosine" role="gridcell">cos</button>
      <button class="btn" data-action="tan" aria-label="Tangent" role="gridcell">tan</button>
      <button class="btn" data-action="M+" aria-label="Memory add" role="gridcell">M+</button>
      <button class="btn" data-action="M-" aria-label="Memory subtract" role="gridcell">M‑</button>

      <!-- Row 7 – Memory -->
      <button class="btn" data-action="MR" aria-label="Memory recall" role="gridcell">MR</button>
      <button class="btn" data-action="MC" aria-label="Memory clear" role="gridcell">MC</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

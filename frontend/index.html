<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Planner & To‑Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Daily Planner</h1>
  </header>

  <main>
    <section class="calendar-section">
      <div class="calendar-header">
        <button id="prevMonth" aria-label="Previous month">&#8249;</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth" aria-label="Next month">&#8250;</button>
      </div>
      <table class="calendar" aria-label="Calendar">
        <thead>
          <tr>
            <th>Sun</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
          </tr>
        </thead>
        <tbody id="calendarBody"></tbody>
      </table>
    </section>

    <section class="tasks-section">
      <div class="tasks-header">
        <h2 id="selectedDate">Tasks for <span></span></h2>
        <button id="addTaskBtn">Add Task</button>
      </div>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <!-- Modal for Add/Edit Task -->
  <div id="taskModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle">Add Task</h3>
      <form id="taskForm" novalidate>
        <input type="hidden" id="taskId" />
        <label for="taskTitle">Title:</label>
        <input type="text" id="taskTitle" required maxlength="50" />
        <label for="taskDesc">Description:</label>
        <textarea id="taskDesc" rows="3" maxlength="200"></textarea>
        <input type="hidden" id="taskDate" />
        <div class="form-actions">
          <button type="submit">Save</button>
          <button type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

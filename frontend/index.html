<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <!-- Display (read‑only) -->
    <input type="text" id="display" class="calculator__display" readonly />

    <!-- Button grid -->
    <div class="calculator__keys">
      <button class="key key--operator" data-action="clear">C</button>
      <button class="key key--operator" data-action="delete">←</button>
      <button class="key key--operator" data-action="/">÷</button>
      <button class="key key--operator" data-action="*">×</button>

      <button class="key" data-action="7">7</button>
      <button class="key" data-action="8">8</button>
      <button class="key" data-action="9">9</button>
      <button class="key key--operator" data-action="-">−</button>

      <button class="key" data-action="4">4</button>
      <button class="key" data-action="5">5</button>
      <button class="key" data-action="6">6</button>
      <button class="key key--operator" data-action="+">+</button>

      <button class="key" data-action="1">1</button>
      <button class="key" data-action="2">2</button>
      <button class="key" data-action="3">3</button>
      <button class="key key--equals" data-action="=">=</button>

      <button class="key key--zero" data-action="0">0</button>
      <button class="key" data-action=".">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

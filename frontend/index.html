<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div id="display" class="display" aria-live="polite" aria-atomic="true">0</div>
    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn" data-action="clear" aria-label="Clear">C</button>
      <button class="btn" data-action="delete" aria-label="Delete">⌫</button>
      <button class="btn" data-action="operator" data-value="/" aria-label="Divide">÷</button>
      <button class="btn" data-action="operator" data-value="*" aria-label="Multiply">×</button>
      <!-- Row 2 -->
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn" data-action="operator" data-value="-" aria-label="Subtract">−</button>
      <!-- Row 3 -->
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn" data-action="operator" data-value="+" aria-label="Add">+</button>
      <!-- Row 4 -->
      <button class="btn" data-action="parenthesis" data-value="(" aria-label="Open parenthesis">(</button>
      <button class="btn" data-value="0">0</button>
      <button class="btn" data-action="parenthesis" data-value=")" aria-label="Close parenthesis">)</button>
      <button class="btn" data-action="decimal" data-value="." aria-label="Decimal point">.</button>
      <!-- Row 5 -->
      <button class="btn equal" data-action="equals" aria-label="Equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
